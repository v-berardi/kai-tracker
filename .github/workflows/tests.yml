# Runs the linter and the unit tests on every push and pull request.
# The tests don't need FinBERT or a database, so I only install what
# they use (no torch, it is too big for this).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas numpy scipy pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -v
